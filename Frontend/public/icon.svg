<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="url(#grad)" rx="22"/>
  
  <!-- Baby head -->
  <circle cx="50" cy="38" r="18" fill="white" opacity="0.95"/>
  
  <!-- Baby body -->
  <ellipse cx="50" cy="68" rx="22" ry="28" fill="white" opacity="0.95"/>
  
  <!-- Eyes -->
  <circle cx="44" cy="36" r="2.5" fill="#8b5cf6"/>
  <circle cx="56" cy="36" r="2.5" fill="#8b5cf6"/>
  
  <!-- Smile -->
  <path d="M 42 42 Q 50 46 58 42" stroke="#8b5cf6" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Heart on body -->
  <path d="M 50 58 L 54 54 Q 56 52 56 50 Q 56 48 54 48 Q 52 48 50 50 Q 48 48 46 48 Q 44 48 44 50 Q 44 52 46 54 Z" fill="#ec4899" opacity="0.9"/>
  
  <!-- Arms -->
  <ellipse cx="32" cy="65" rx="6" ry="12" fill="white" opacity="0.9" transform="rotate(-20 32 65)"/>
  <ellipse cx="68" cy="65" rx="6" ry="12" fill="white" opacity="0.9" transform="rotate(20 68 65)"/>
</svg>
