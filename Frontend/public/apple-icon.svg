<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="180" fill="url(#appleGrad)" rx="40"/>
  
  <!-- Baby head -->
  <circle cx="90" cy="68" r="32" fill="white" opacity="0.95"/>
  
  <!-- Baby body -->
  <ellipse cx="90" cy="122" rx="40" ry="50" fill="white" opacity="0.95"/>
  
  <!-- Eyes -->
  <circle cx="80" cy="65" r="4.5" fill="#8b5cf6"/>
  <circle cx="100" cy="65" r="4.5" fill="#8b5cf6"/>
  
  <!-- Smile -->
  <path d="M 75 76 Q 90 83 105 76" stroke="#8b5cf6" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- Heart on body -->
  <path d="M 90 105 L 98 97 Q 102 93 102 89 Q 102 85 98 85 Q 94 85 90 89 Q 86 85 82 85 Q 78 85 78 89 Q 78 93 82 97 Z" fill="#ec4899" opacity="0.9"/>
  
  <!-- Arms -->
  <ellipse cx="55" cy="115" rx="11" ry="22" fill="white" opacity="0.9" transform="rotate(-20 55 115)"/>
  <ellipse cx="125" cy="115" rx="11" ry="22" fill="white" opacity="0.9" transform="rotate(20 125 115)"/>
  
  <!-- Sparkles -->
  <circle cx="30" cy="40" r="3" fill="white" opacity="0.8"/>
  <circle cx="150" cy="50" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="40" cy="140" r="2" fill="white" opacity="0.8"/>
  <circle cx="140" cy="140" r="3" fill="white" opacity="0.8"/>
</svg>
